<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | My Blog</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-private="true">
  <header class="site-header">
    <a class="brand" href="index.html">My Blog</a>

    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="create.html">Create Blog</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main class="container">

    <section class="page-hero dashboard-hero">
      <span class="eyebrow">📊 YOUR WRITING SPACE</span>
      <h1>Your dashboard</h1>
      <p>All your blog posts in one place. Keep the ideas coming! ✨</p>
      <a class="hero-button" href="create.html">✍️ Write a new blog</a>
    </section>

    <h2 class="section-title">📚 My blogs</h2>

    <!-- Search and Category filter (Module 04) -->
    <div class="blog-filters">
      <input
        id="search-input"
        type="search"
        placeholder="🔍 Search blogs by title or content..."
        aria-label="Search blogs"
      >

      <select id="category-filter" aria-label="Filter by category">
        <option value="All">All categories</option>
        <option value="General">General</option>
        <option value="Technology">Technology</option>
        <option value="Travel">Travel</option>
        <option value="Food">Food</option>
        <option value="Lifestyle">Lifestyle</option>
        <option value="Education">Education</option>
        <option value="Health">Health</option>
      </select>
    </div>

    <div id="posts" class="post-grid" data-mine="true"></div>

  </main>
</body>
</html>
